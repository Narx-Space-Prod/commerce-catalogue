name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@f907416baf6ffca41626f10df94f7631d86de8c0
  catalogue:
    needs: workflows
    permissions:
      contents: read
      id-token: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/service.yml@f907416baf6ffca41626f10df94f7631d86de8c0
    with:
      component: catalogue
  release:
    needs: [workflows, catalogue]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    permissions:
      contents: write
    uses: Narx-Space-Prod/platform-ci/.github/workflows/release.yml@f907416baf6ffca41626f10df94f7631d86de8c0
    with:
      releases: |
        [
          {"component":"catalogue","image":"${{ needs.catalogue.outputs.image }}","digest":"${{ needs.catalogue.outputs.digest }}"}
        ]
    secrets:
      release-app-private-key: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
